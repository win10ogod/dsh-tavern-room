name: Plugin package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm pack --pack-destination .
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-tavern-room
          path: dsh-tavern-room-*.tgz
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish installable package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_RUN: ${{ github.run_id }}
        run: |
          gh run download $env:BUILD_RUN --name dsh-tavern-room --dir package
          $asset = (Get-ChildItem package/dsh-tavern-room-*.tgz).FullName
          gh release create $env:RELEASE_TAG $asset --verify-tag --generate-notes
